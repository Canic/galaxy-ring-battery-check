plugins {
    id 'com.android.application' version '8.6.1'
}

def appVersionCode = providers.gradleProperty('appVersionCode').getOrElse('1').toInteger()
def appVersionName = providers.gradleProperty('appVersionName').getOrElse('1.0.0').replaceFirst('^v', '')

android {
    namespace 'dev.galaxydiagnostic.ringbattery'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.galaxydiagnostic.ringbattery'
        minSdk 31
        targetSdk 35
        versionCode = appVersionCode
        versionName = appVersionName
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
}
