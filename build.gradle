plugins {
    id 'com.android.application' version '8.6.1'
}

android {
    namespace 'dev.galaxydiagnostic.ringbattery'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.galaxydiagnostic.ringbattery'
        minSdk 31
        targetSdk 35
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName System.getenv('GITHUB_REF_NAME')?.replaceFirst('^v', '') ?: '1.0.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
}
